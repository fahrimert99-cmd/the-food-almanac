name: Onizleme Dosyalarini Al (gecici)

# Biten bir önizleme koşusunun artifact'ından kapak, kare paneli ve log'u bu
# dala kaydeder (video hariç). Yeniden üretim yapmaz, kredi harcamaz.
on:
  push:
    branches: [claude/adoring-sagan-ni2qvl]
    paths: [.github/workflows/onizleme_al.yml]

permissions:
  contents: write
  actions: read

jobs:
  al:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: uzun-onizleme
          run-id: 36875241414
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: indirilen
      - name: Dala kaydet
        run: |
          find indirilen -type f | xargs ls -la
          mkdir -p onizleme/uzun
          for f in kapak.jpg kareler.jpg; do
            p=$(find indirilen -name "$f" | head -1); [ -n "$p" ] && cp "$p" onizleme/uzun/
          done
          p=$(find indirilen -name "uzun_onizleme.log" | head -1); [ -n "$p" ] && cp "$p" onizleme/uzun/
          git config user.name "onizleme-bot"
          git config user.email "onizleme-bot@users.noreply.github.com"
          git add -f onizleme/uzun
          git commit -m "onizleme: kapak + kare paneli (#6)" || exit 0
          git push origin HEAD:claude/adoring-sagan-ni2qvl
