name: LTX-Video Testi (gecici, ucretsiz, YUKLEMEZ)

# Açık kaynak LTX-Video ile GitHub CPU'sunda deneme klibi üretir. YouTube'a YUKLEMEZ.
on:
  push:
    branches: [claude/adoring-sagan-ni2qvl]
    paths: [.github/workflows/ltx_test.yml, ltx_test.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/adoring-sagan-ni2qvl
      - name: Disk aç (model ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Kur
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate sentencepiece imageio imageio-ffmpeg protobuf
      - name: Üret
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python3 ltx_test.py
      - name: Dala kaydet
        if: always()
        run: |
          git config user.name "onizleme-bot"
          git config user.email "onizleme-bot@users.noreply.github.com"
          git add -f onizleme/ltx || true
          git commit -m "onizleme: LTX-Video testi" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin claude/adoring-sagan-ni2qvl && git push origin HEAD:claude/adoring-sagan-ni2qvl && break; sleep 5; done
