name: HeyGen Presenter Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'İsteğe bağlı özel Video Agent promptu'
        required: false
        type: string
      timeout:
        description: 'HeyGen bekleme süresi'
        required: false
        default: '20m'
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: HeyGen CLI kur
        shell: bash
        run: |
          curl -fsSL https://static.heygen.ai/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/heygen" --version

      - name: Secret varlığını doğrula (değeri gösterilmez)
        shell: bash
        run: |
          if [ -z "$HEYGEN_API_KEY" ]; then
            echo 'HEYGEN_API_KEY secret bulunamadı veya boş.' >&2
            exit 1
          fi
          echo 'HEYGEN_API_KEY secret workflow tarafından alındı.'

      - name: Presenter videosu üret
        shell: bash
        run: |
          if [ -n "${{ inputs.prompt }}" ]; then
            python3 food_almanac_presenter_test.py \
              --prompt "${{ inputs.prompt }}" \
              --timeout "${{ inputs.timeout }}" \
              --output-dir heygen-output
          else
            python3 food_almanac_presenter_test.py \
              --timeout "${{ inputs.timeout }}" \
              --output-dir heygen-output
          fi

      - name: Video ve metadata’yı artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-almanac-heygen-presenter-test
          path: heygen-output/
          if-no-files-found: warn
