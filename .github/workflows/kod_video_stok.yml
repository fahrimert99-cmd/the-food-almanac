name: Kod Video Stok (marka serisi onceden render)

# 12:00 marka serisi videolarını ÖNCEDEN render edip "kod-video-stok" release'ine
# yükler. otomasyon.py yayın anında önce buradaki hazır videoyu kullanır.
# YouTube'a YUKLEMEZ. Senaryo/tarif/sürüm değişen videolar otomatik yeniden render edilir.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [kod_video.py, kod_sahneler.json, .github/workflows/kod_video_stok.yml]
  schedule:
    - cron: "17 2 * * 1"   # haftalık tamamlama (yeni marka senaryosu eklendiyse)

permissions:
  contents: write

concurrency:
  group: kod-video-stok
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    steps:
      - name: Stok release'i yoksa oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view kod-video-stok >/dev/null 2>&1 || \
            gh release create kod-video-stok --prerelease --title "Kod video stoğu (otomatik)" \
              --notes "12:00 marka serisi için önceden render edilmiş Shorts. otomasyon.py yayında kullanır; elle silmeyin."
  render:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parca: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg && break
            sleep 10
          done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Eksik stok videolarını render et
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KOD_VIDEO_SES_DIR: ""
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 kod_video.py --stok-render ${{ matrix.parca }} 4
      - name: Stoğa yükle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls stok/*.mp4 >/dev/null 2>&1 || { echo "yüklenecek video yok"; exit 0; }
          for f in stok/*.mp4; do
            for i in 1 2 3; do gh release upload kod-video-stok "$f" --clobber && break; sleep 5; done
          done
