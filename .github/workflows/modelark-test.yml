name: ModelArk Seedance Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/modelark-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ModelArk ile 5 saniyelik test klibi oluştur
        env:
          MODELARK_API_KEY: ${{ secrets.MODELARK_API_KEY }}
          MODELARK_MODEL: ${{ secrets.MODELARK_MODEL }}
        run: |
          set -euo pipefail
          test -n "$MODELARK_API_KEY" || { echo "MODELARK_API_KEY eksik"; exit 1; }
          test -n "$MODELARK_MODEL" || { echo "MODELARK_MODEL eksik"; exit 1; }
          echo "ModelArk modeli: $MODELARK_MODEL"
          body=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "model": os.environ["MODELARK_MODEL"],
            "content": [{
              "type": "text",
              "text": "A calm 5-second educational food-science shot in vintage scientific engraving style: a garlic bulb beside a small anatomical nutrition diagram, subtle camera push-in, warm parchment background, no text, no logos."
            }],
            "ratio": "16:9",
            "duration": 5,
            "watermark": False
          }))
          PY
          )
          set +e
          response=$(curl -sS --max-time 60 -w '\nHTTP_STATUS:%{http_code}' \
            -X POST 'https://ark.ap-southeast.bytepluses.com/api/v3/contents/generations/tasks' \
            -H "Authorization: Bearer $MODELARK_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$body")
          rc=$?
          set -e
          echo "$response" | sed -E 's/(Bearer|api[_-]?key|token)[^, ]*/[REDACTED]/Ig'
          exit "$rc"
