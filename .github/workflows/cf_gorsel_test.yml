name: Cloudflare Gorsel Testi (gecici)
on:
  push:
    branches: [claude/adoring-sagan-ni2qvl]
    paths: [.github/workflows/cf_gorsel_test.yml, cf_gorsel_test.py]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: Test
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 cf_gorsel_test.py | tee onizleme_cf.txt
      - name: Dala kaydet
        if: always()
        run: |
          mkdir -p onizleme/cf_test; cp onizleme_cf.txt onizleme/cf_test/sonuc.txt || true
          git config user.name "onizleme-bot"; git config user.email "onizleme-bot@users.noreply.github.com"
          git add -f onizleme/cf_test; git commit -m "test: Cloudflare görsel sonucu" || exit 0
          git push origin HEAD:claude/adoring-sagan-ni2qvl
