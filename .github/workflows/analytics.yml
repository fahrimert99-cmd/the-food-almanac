name: Haftalik Analytics + Oneri Uygula

on:
  # DURDURULDU (2026-10): kanal 'The Food Almanac' (İngilizce uzun video) oldu; Türkçe Shorts hattı zamanlanmış
  # çalışmaz. Elle 'Run workflow' hâlâ çalışır. Geri açmak için aşağıdaki satırların başındaki '#'i kaldırın.
  # schedule:
  #  - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      baslik_guclendir:
        description: "Toplu baslik guclendirme"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      baslik_dry_run:
        description: "Baslik dry-run"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

concurrency:
  group: analytics-oneri
  cancel-in-progress: false

jobs:
  rapor-uygula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install -r requirements.txt

      - name: 1) Veri cek + analiz + oneri
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 analytics_rapor.py

      - name: 2) Toplu baslik guclendirme
        if: ${{ github.event_name == 'schedule' || inputs.baslik_guclendir == 'true' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BASLIK_MAX: "20"
          BASLIK_DRY_RUN: ${{ inputs.baslik_dry_run || 'false' }}
        run: |
          python3 baslik_guclendir.py
          echo "BASLIK_UYGULANDI=1" >> $GITHUB_ENV

      - name: 3) Onerileri guvenli uygula
        env:
          BASLIK_UYGULANDI: ${{ env.BASLIK_UYGULANDI || '0' }}
        run: python3 oneri_uygula.py

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytics-oneri-${{ github.run_id }}
          path: |
            analytics_rapor.json
            oneri_tema.json
            baslik_guclendir_rapor.json
          if-no-files-found: warn

      - name: Kaydet (12/20 slot DOKUNULMAZ)
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add durum.json analytics_rapor.json oneri_tema.json senaryolar_oncelik.json || true
          git commit -m "analytics+oneri: veri → analiz → güvenli uygulama (12/20 korunur)" || {
            echo "degisiklik yok"; exit 0
          }
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam"; exit 0
            fi
            sleep $((2 ** i))
          done
          exit 0
