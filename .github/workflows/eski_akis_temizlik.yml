name: Eski Is Akisi Temizligi
# Actions sayfasında yalnızca The Food Almanac iş akışları kalsın: dosyası artık depoda olmayan eski
# (Türkçe Shorts) iş akışlarının çalıştırma geçmişi silinir. Geçmişi biten iş akışı listeden kalkar.
# (tetik: 2)
# API sınırı yüzünden bir çalıştırmada en çok ~700 kayıt silinir; kalanlar her gün devam eder,
# bitince yalnızca birkaç saniyelik bir kontrol yapılır. Dallara, sürümlere ve koda dokunmaz.
on:
  push:
    branches: [main]
    paths: [.github/workflows/eski_akis_temizlik.yml]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: eski-akis-temizlik
  cancel-in-progress: false

jobs:
  temizle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Eski iş akışlarının çalıştırma geçmişini sil
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          # Çalıştırmalar tek tek taranır: iş akışı listesi yeni silinen dosyaları hemen göstermeyebiliyor.
          import json, os, subprocess
          R = os.environ["R"]

          def gh(*a):
              r = subprocess.run(["gh", "api", *a], capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None

          mevcut = {f".github/workflows/{f}" for f in os.listdir(".github/workflows")}
          SINIR, silinecek, sayfa = 700, [], 1
          while len(silinecek) < SINIR:
              d = json.loads(gh(f"repos/{R}/actions/runs?per_page=100&page={sayfa}") or "{}")
              runs = d.get("workflow_runs", [])
              if not runs:
                  break
              silinecek += [r["id"] for r in runs if r.get("path") not in mevcut]
              sayfa += 1
          silinecek = silinecek[:SINIR]
          silinen = sum(1 for i in silinecek if gh("-X", "DELETE", f"repos/{R}/actions/runs/{i}") is not None)
          print(f"eski iş akışı çalıştırması silindi: {silinen}" + (" (günlük sınır; kalanlar yarın)" if silinen >= SINIR else ""))
          PY
