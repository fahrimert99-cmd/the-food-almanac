name: CI (kontrol)
# Hızlı sağlık kontrolü: her push ve PR'da. Bozuk bir değişiklik zamanlanmış üretime ulaşmadan yakalanır.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# shell açıkça "bash" olunca GitHub -eo pipefail ile çalıştırır: "komut | tail" gibi borularda
# ilk komutun hatası gizlenmez (yoksa proje_kontrol.py başarısız olsa da CI yeşil görünür).
defaults:
  run:
    shell: bash

jobs:
  kontrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uzun_en/remotion/package-lock.json
      - name: Bağımlılıklar
        run: |
          pip install -q -r requirements.txt numpy
          cd uzun_en/remotion && npm ci --no-audit --no-fund
      - name: Python derleme (sözdizimi)
        run: python -m compileall -q uzun_en/araclar
      - name: JSON dosyaları geçerli mi
        run: |
          python3 - <<'PY'
          import glob, json, sys
          hata = 0
          for f in sorted(glob.glob("uzun_en/*.json") + glob.glob("uzun_en/projeler/*/*.json")):
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  print(f"✗ {f}: {e}"); hata = 1
          sys.exit(hata)
          PY
      - name: Senaryolar (proje_kontrol)
        run: |
          for p in uzun_en/projeler/*/proje.json; do
            python3 uzun_en/araclar/proje_kontrol.py --proje "$(basename "$(dirname "$p")")" | tail -1
          done
      - name: Lemo yedeği (görsel servisleri çökünce kodla çizilen levha)
        run: |
          npm ci --prefix uzun_en/lemo --no-audit --no-fund --loglevel=error
          printf '%s' '[{"cikti":"/tmp/lemo/y.jpg","w":1920,"h":1080,"nesneler":[["bowl","oats"],["glass","milk"]],"tohum":3,"sag_bos":true},{"cikti":"/tmp/lemo/d.jpg","w":1080,"h":1920,"nesneler":[["cup","coffee"]],"tohum":4,"sag_bos":false}]' > /tmp/lemo.json
          node uzun_en/lemo/levha.mjs /tmp/lemo.json
          python3 -c "from PIL import Image; import sys; s=[Image.open(f).size for f in ('/tmp/lemo/y.jpg','/tmp/lemo/d.jpg')]; print(s); sys.exit(0 if s==[(1920,1080),(1080,1920)] else 1)"
      - name: Plan (takvim kararı, yazmadan)
        run: |
          python3 -m unittest discover -s uzun_en/araclar -p "test_*.py" -v
          python3 uzun_en/araclar/plan.py --goster | tail -3
      - name: Remotion tip denetimi (her projenin sahneleri)
        run: |
          python3 - <<'PY'
          # tsc için tam.gen.json gerekir: her proje için küçük bir sahte çizelge yazılır, sahneler kurulur
          import os, subprocess, sys
          sys.path.insert(0, "uzun_en/araclar")
          import ortak as O
          from hazirla import sahneleri_kur
          hata = 0
          for slug in sorted(os.listdir(O.PROJELER)):
              p = O.proje(slug)
              if not p:
                  continue
              sahneleri_kur(slug, p)
              s = [{"id": x["id"], "bas": 0, "sure": 1, "meta": {"gorsel": None},
                    "cumleler": [{"bas": 0, "sure": 1, "metin": "x", "dosya": "", "nokta": [[0, 0], [1, 1]]}]}
                   for x in p["sahneler"]]
              O.json_yaz(os.path.join(O.REMOTION, "src", "tam", "tam.gen.json"),
                         {"fps": 30, "toplam": 1, "gecis": 0.35, "slug": slug, "sahneler": s, "altyazi": [],
                          "kapak": {"satirlar": [], "gorsel": None}})
              r = subprocess.run(["npx", "tsc", "-p", "."], cwd=O.REMOTION)
              print(f"{slug}: {'temiz' if r.returncode == 0 else 'TİP HATASI'}")
              hata |= r.returncode
          sys.exit(1 if hata else 0)
          PY
