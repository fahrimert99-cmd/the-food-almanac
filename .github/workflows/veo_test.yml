name: Veo Klip Testi (gecici, YUKLEMEZ)

# Gemini API Veo ile 8 sn'lik 9:16 deneme klibi üretir. YouTube'a YUKLEMEZ.
on:
  push:
    branches: [claude/adoring-sagan-ni2qvl]
    paths: [.github/workflows/veo_test.yml, veo_test.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/adoring-sagan-ni2qvl
      - name: Veo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python3 veo_test.py
      - name: Dala kaydet
        if: always()
        run: |
          git config user.name "onizleme-bot"
          git config user.email "onizleme-bot@users.noreply.github.com"
          git add -f onizleme/veo
          git commit -m "onizleme: Veo testi" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin claude/adoring-sagan-ni2qvl && git push origin HEAD:claude/adoring-sagan-ni2qvl && break; sleep 5; done
