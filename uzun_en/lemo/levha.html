<!doctype html>
<html><head><meta charset="utf-8"><title>Lemo levha</title>
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// levha.mjs her sahne için window.ciz(spec) çağırır; tuval spec boyutuna ayarlanır.
import { draw } from './levha.js';
const c = document.getElementById('c'), ctx = c.getContext('2d');
window.ciz = spec => { c.width = spec.w; c.height = spec.h; return draw(ctx, spec); };
window.READY = true;
</script></body></html>
